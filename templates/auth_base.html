{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ brand_name_en }}{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;1,14..32,400&family=Noto+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="icon" href="{% static 'favicon.ico' %}" sizes="any">
  <link rel="icon" href="{% static 'favicon-32.png' %}" type="image/png" sizes="32x32">
  <link rel="icon" href="{% static 'favicon-16.png' %}" type="image/png" sizes="16x16">
  <link rel="apple-touch-icon" href="{% static 'favicon-180.png' %}" sizes="180x180">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body class="te-auth-body">
<div class="te-auth-page{% block auth_page_class %}{% endblock %}">
  <div class="te-auth-duo">
    <aside class="te-auth-brand-card" aria-label="Company branding">
      {% include "partials/auth_panel_brand.html" %}
    </aside>

    <div class="te-auth-form-card">
      <div class="te-auth-form-card__inner">
        {% if messages %}
        <div class="te-auth-page__messages">
          {% for message in messages %}
          <div class="alert alert-{{ message.tags }} mb-2 shadow-sm" role="alert">{{ message }}</div>
          {% endfor %}
        </div>
        {% endif %}

        {% block auth_card %}{% endblock %}

        <p class="te-auth-switch mb-0">
          {% block auth_switch %}{% endblock %}
        </p>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>
</html>
