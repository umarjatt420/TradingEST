{% extends "base.html" %}
{% block title %}Delete project · {{ brand_name_en }}{% endblock %}
{% block header_title %}Delete project{% endblock %}

{% block content %}
<div class="te-page-card mx-auto" style="max-width: 520px;">
  <h2 class="h5 mb-3">Delete this project?</h2>
  <p class="text-muted mb-0">{{ object.name }}</p>
  <form method="post" class="d-flex flex-wrap gap-2 mt-4">
    {% csrf_token %}
    <button type="submit" class="btn te-btn-danger">Delete</button>
    <a class="btn te-btn-secondary" href="{% url 'projects:list' %}">Cancel</a>
  </form>
</div>
{% endblock %}
